name: News pipeline

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state and apply your decisions
        run: python ci.py before

      - name: Collect, filter, summarise
        run: python pipeline.py run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_MAX_LLM_CALLS: "60"

      - name: Save state and draft list
        run: python ci.py after

      - name: Commit results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/fashion.sql content/
          git diff --staged --quiet || (git commit -m "Update news" && git pull --rebase && git push)
